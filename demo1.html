<!doctype html>
<html lang="zh-TW">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位名片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBB9A8;
      border-radius: 4px;
    }
    
    /* 平滑過渡效果 */
    .smooth-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Accordion 動畫 */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    
    .accordion-content.active {
      max-height: 500px;
    }
    
    /* Modal 淡入淡出 */
    .modal-overlay {
      animation: fadeIn 0.2s ease-out;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    /* 弧形背景設計 */
    .curved-bg {
      position: relative;
      background: #CBB9A8;
      border-radius: 24px 24px 0 0;
      height: 140px;
      overflow: visible;
    }
    
    .curved-bg::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 40px;
      background: #CBB9A8;
      border-radius: 0 0 50% 50% / 0 0 30% 30%;
      z-index: 1;
    }
    
    /* 圓形大頭照樣式 */
    .profile-photo {
      width: 140px;
      height: 140px;
      background-color: #F2ECE6;
      border: 6px solid white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 10;
    }
    
    .profile-photo:hover {
      transform: scale(1.05);
    }
    
    /* 社群圖示懸停效果 */
    .social-icon {
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    
    .social-icon:hover {
      transform: translateY(-4px);
      opacity: 0.8;
    }
    
    /* 按鈕樣式 */
    .primary-btn {
      background: #CBB9A8;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(203, 185, 168, 0.4);
    }
    
    /* 編輯模式 Modal 樣式 */
    .edit-modal {
      max-height: 90%;
      overflow-y: auto;
    }
    
    /* 輸入欄位樣式 */
    .input-field {
      border: 2px solid #E5E5E5;
      transition: border-color 0.2s ease;
    }
    
    .input-field:focus {
      outline: none;
      border-color: #CBB9A8;
    }
    
    /* QR Code 區域 */
    .qr-section {
      background: linear-gradient(135deg, #F9F6F3 0%, #FFFFFF 100%);
      border: 2px dashed #CBB9A8;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="w-full min-h-full" style="background-color: #F2ECE6;"><!-- 主容器 (桌機版置中) -->

   <div class="w-full max-w-md"><!-- 名片主體卡片 -->

     <div class="curved-bg"></div>

     </div><!-- 主要資訊區 -->

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg><span>下載名片</span>

       <div class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
        </svg><span>分享網址</span>
       </div></button>
     </div><!-- 頁尾 -->
     <div class="text-center py-6 border-t" style="border-color: #E5E5E5;">
      <p class="text-xs mb-3" style="color: #7B6F68;">© 2024 數位名片系統</p><button onclick="openEditModal()" class="text-xs font-medium smooth-transition hover:opacity-70 inline-flex items-center gap-1" style="color: #CBB9A8;">
       <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
       </svg><span>編輯模式</span> </button>
     </div>
    </div>
   </div>
  </div><!-- Modal: 關於我 (大頭照點擊) -->

   <div class="bg-white rounded-3xl max-w-lg w-full p-8 relative shadow-2xl"><button onclick="closeAboutModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 smooth-transition">

    </div>

  </div><!-- Modal: QR Code 放大 -->

    </div>
   </div>
  </div><!-- Modal: 預約表單 -->
  <div id="appointmentModal" class="modal-overlay fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50 p-4">

     <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
     </svg></button>
    <h3 class="text-2xl font-bold mb-6 text-center" style="color: #2E2A27;">預約諮詢</h3>

     <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">姓名</label> <input type="text" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="請輸入您的姓名">
     </div>
     <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">聯絡電話</label> <input type="tel" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="請輸入聯絡電話">
     </div>
     <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">Email</label> <input type="email" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="請輸入 Email">
     </div>
     <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">預約時間</label> <input type="datetime-local" required class="input-field w-full px-4 py-3 rounded-xl">
     </div>
     <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">備註</label> <textarea class="input-field w-full px-4 py-3 rounded-xl" rows="3" placeholder="其他需求或說明"></textarea>
     </div><button type="submit" class="primary-btn w-full text-white font-semibold py-4 rounded-xl">確認送出</button>
    </form>
   </div>
  </div><!-- Modal: 編輯模式 (CMS ����) -->
  <div id="editModal" class="modal-overlay fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50 p-4">
   <div class="edit-modal bg-white rounded-3xl max-w-4xl w-full p-8 relative shadow-2xl"><button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 smooth-transition">
     <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
     </svg></button>
    <h3 class="text-3xl font-bold mb-8 text-center" style="color: #2E2A27;">編輯名片內容</h3>
    <form id="editForm" class="space-y-8" onsubmit="saveChanges(event)"><!-- 圖片設定 -->
     <div class="border-b pb-6" style="border-color: #E5E5E5;">
      <h4 class="text-lg font-semibold mb-4" style="color: #CBB9A8;">圖片設定</h4>
      <div class="grid md:grid-cols-2 gap-4">
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">大頭照 URL</label> <input type="url" id="editPhotoUrl" class="input-field w-full px-4 py-3 rounded-xl" placeholder="https://example.com/photo.jpg">
       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">QR Code 圖片 URL</label> <input type="url" id="editQRUrl" class="input-field w-full px-4 py-3 rounded-xl" placeholder="https://example.com/qr.png">
       </div>
      </div>
     </div><!-- 基本資料 -->
     <div class="border-b pb-6" style="border-color: #E5E5E5;">

       </div>

       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">職稱</label> <input type="text" id="editJobTitle" class="input-field w-full px-4 py-3 rounded-xl" placeholder="臨床心理師">
       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">主 CTA 按鈕文字</label> <input type="text" id="editCtaText" class="input-field w-full px-4 py-3 rounded-xl" placeholder="預約諮詢">
       </div>
      </div>

       </div>

       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">Email</label> <input type="email" id="editEmail" class="input-field w-full px-4 py-3 rounded-xl" placeholder="example@email.com">
       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">LINE ID/連結</label> <input type="text" id="editLine" class="input-field w-full px-4 py-3 rounded-xl" placeholder="line_id 或 https://line.me/ti/p/...">

       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">X (Twitter) 連結</label> <input type="url" id="editTwitter" class="input-field w-full px-4 py-3 rounded-xl" placeholder="https://x.com/...">
       </div>

     </div><!-- 網址設定 -->
     <div class="border-b pb-6" style="border-color: #E5E5E5;">
      <h4 class="text-lg font-semibold mb-4" style="color: #CBB9A8;">網址設定</h4>

       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">分享網址 (選填)</label> <input type="url" id="editShareUrl" class="input-field w-full px-4 py-3 rounded-xl" placeholder="留空則分享當前頁面">
       </div>

     </div><!-- 專業服務 -->

       </div>
       <div><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">服務 3 標題</label> <input type="text" id="editService3Title" class="input-field w-full px-4 py-3 rounded-xl mb-2" placeholder="企業培訓"> <label class="block text-sm font-medium mb-2" style="color: #7B6F68;">服務 3 內容</label> <textarea id="editService3Content" class="input-field w-full px-4 py-3 rounded-xl" rows="3" placeholder="詳細描述服務內容..."></textarea>
       </div>
      </div>
     </div><!-- 關於我 -->
     <div>
      <h4 class="text-lg font-semibold mb-4" style="color: #CBB9A8;">關於我</h4><label class="block text-sm font-medium mb-2" style="color: #7B6F68;">詳細自我介紹</label> <textarea id="editAbout" class="input-field w-full px-4 py-3 rounded-xl" rows="6" placeholder="介紹您的專業背景、經歷、專長等..."></textarea>
     </div><!-- 儲存按鈕 -->
     <div class="flex gap-4 pt-4"><button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-200 text-gray-700 font-semibold py-4 rounded-xl smooth-transition hover:bg-gray-300">取消</button> <button type="submit" class="flex-1 primary-btn text-white font-semibold py-4 rounded-xl">儲存變更</button>
     </div>
    </form>
   </div>
  </div>
  <script>
    // ==================== 預設設定檔 (Default Config) ====================
    const defaultConfig = {
      // 圖片設定

    // ==================== 渲染服務項目 Accordion ====================
    function renderServices() {
      const accordion = document.getElementById('servicesAccordion');
      accordion.innerHTML = '';
      
      const services = [
        { title: currentConfig.service1Title, content: currentConfig.service1Content },
        { title: currentConfig.service2Title, content: currentConfig.service2Content },
        { title: currentConfig.service3Title, content: currentConfig.service3Content }
      ];
      
      services.forEach((service, index) => {
        if (service.title && service.content) {
          const item = document.createElement('div');
          item.className = 'border rounded-xl overflow-hidden';
          item.style.borderColor = '#E5E5E5';
          
          item.innerHTML = `
            <button 
              class="accordion-header w-full px-4 py-4 flex items-center justify-between smooth-transition hover:bg-gray-50"
              onclick="toggleAccordion(${index})"
            >
              <span class="font-semibold text-left" style="color: #2E2A27;">${service.title}</span>
              <svg class="accordion-arrow w-5 h-5 smooth-transition" style="color: #B68956;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <div class="accordion-content" id="accordion-${index}">
              <div class="px-4 pb-4 text-sm leading-relaxed" style="color: #7B6F68;">
                ${service.content}
              </div>
            </div>
          `;
          
          accordion.appendChild(item);
        }
      });
    }
    
    // ==================== Accordion 開關功能 ====================
    function toggleAccordion(index) {
      const content = document.getElementById(`accordion-${index}`);
      const arrow = content.previousElementSibling.querySelector('.accordion-arrow');
      
      if (content.classList.contains('active')) {
        content.classList.remove('active');
        arrow.style.transform = 'rotate(0deg)';
      } else {
        // 關閉所有其他 accordion
        document.querySelectorAll('.accordion-content').forEach(item => {
          item.classList.remove('active');
        });
        document.querySelectorAll('.accordion-arrow').forEach(arr => {
          arr.style.transform = 'rotate(0deg)';
        });
        
        // 開啟當前 accordion
        content.classList.add('active');
        arrow.style.transform = 'rotate(180deg)';
      }
    }

      currentConfig = {
        photoUrl: document.getElementById('editPhotoUrl').value || defaultConfig.photoUrl,
        qrCodeUrl: document.getElementById('editQRUrl').value || defaultConfig.qrCodeUrl,
        nameZh: document.getElementById('editNameZh').value || defaultConfig.nameZh,

      // 重新渲染頁面

    // ==================== 下載 vCard ====================
    function downloadVCard() {
      // 如果有自訂 URL，則導向該 URL
      if (currentConfig.vCardUrl) {
        window.open(currentConfig.vCardUrl, '_blank', 'noopener,noreferrer');
        return;
      }
      
      // 否則動態生成 vCard
      const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:${currentConfig.nameZh}
N:${currentConfig.nameZh};;;
TITLE:${currentConfig.jobTitle}
TEL;TYPE=CELL:${currentConfig.whatsapp || ''}
EMAIL:${currentConfig.email || ''}
URL:${currentConfig.facebook || ''}
NOTE:${currentConfig.about || ''}
END:VCARD`;
      
      const blob = new Blob([vCardData], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${currentConfig.nameZh}_名片.vcf`;
      link.click();
      window.URL.revokeObjectURL(url);
      
      showDownloadMessage();
    }
    
    function showDownloadMessage() {
      const toast = document.createElement('div');
      toast.className = 'fixed top-4 right-4 bg-blue-500 text-white px-6 py-3 rounded-xl shadow-lg z-50';
      toast.style.animation = 'fadeIn 0.3s ease-out';
      toast.textContent = '✓ 名片已下載';
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease-out';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    // ==================== 分享網址 ====================
    function shareURL() {
      const shareUrl = currentConfig.shareUrl || window.location.href;
      
      // 嘗試使用原生分享 API
      if (navigator.share) {
        navigator.share({
          title: `${currentConfig.nameZh} - ${currentConfig.jobTitle}`,
          text: `查看 ${currentConfig.nameZh} 的數位名片`,
          url: shareUrl
        }).catch(() => {
          // 如果分享失敗或取消，複製連結
          copyToClipboard(shareUrl);
        });
      } else {
        // 不支援原生分享，直接複製連結
        copyToClipboard(shareUrl);
      }
    }
    
    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      
      const toast = document.createElement('div');
      toast.className = 'fixed top-4 right-4 bg-purple-500 text-white px-6 py-3 rounded-xl shadow-lg z-50';
      toast.style.animation = 'fadeIn 0.3s ease-out';
      toast.textContent = '✓ 連結已複製';
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease-out';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
